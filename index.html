
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Genome Project</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="site-header">

            <div class="brand">
                <div class="brand-icon">FG</div>

                <div>
                    <div class="brand-name">
                        FINANCIAL GENOME PROJECT
                    </div>

                    <div class="brand-subtitle">
                        REGIONAL ECONOMIC INTELLIGENCE
                    </div>
                </div>
            </div>

            <div class="system-status">
                <span class="status-dot"></span>
                SYSTEM ONLINE
            </div>

        </header>


        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-content">
                <div class="eyebrow">REGION / 001</div>

                <h1>Shreveport–Bossier</h1>

                <div class="hero-description">
                    Economic Intelligence Dashboard
                </div>
            </div>

            <div class="radar" aria-hidden="true"></div>

        </section>


        <!-- ECONOMIC INDICATORS -->
        <section class="indicators" aria-label="Economic indicators">

            <!-- Employment -->
            <div class="indicator">
                <div class="indicator-label">EMPLOYMENT</div>

                <div class="indicator-value">183.4K</div>

                <div class="indicator-change">+1.2% YoY</div>

                <div class="indicator-note">
                    Illustrative data
                </div>
            </div>


            <!-- GDP -->
            <div class="indicator">
                <div class="indicator-label">REGIONAL GDP</div>

                <div class="indicator-value">$20.2B</div>

                <div class="indicator-change">+2.0% YoY</div>

                <div class="indicator-note">
                    Illustrative data
                </div>
            </div>


            <!-- Population -->
            <div class="indicator">
                <div class="indicator-label">POPULATION</div>

                <div class="indicator-value">383K</div>

                <div class="indicator-change negative">-0.3% YoY</div>

                <div class="indicator-note">
                    Illustrative data
                </div>
            </div>

        </section>

    </main>

</body>
</html>
